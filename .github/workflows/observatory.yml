
name: Profile Observatory

on:
  workflow_dispatch:

  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

concurrency:
  group: profile-observatory
  cancel-in-progress: false

env:
  OBSERVATORY_TIMEZONE: Asia/Kolkata
  OBSERVATORY_DAY_START: "06"
  OBSERVATORY_NIGHT_START: "18"

jobs:
  generate:
    name: Generate Profile Observatory
    runs-on: ubuntu-latest

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Checkout Profile Observatory
        uses: actions/checkout@v4
        with:
          repository: SandeepKomal/Git3D-Universe
          path: .observatory
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 20

      - name: Determine Observatory theme
        id: theme
        shell: bash
        env:
          TIMEZONE: ${{ env.OBSERVATORY_TIMEZONE }}
          DAY_START: ${{ env.OBSERVATORY_DAY_START }}
          NIGHT_START: ${{ env.OBSERVATORY_NIGHT_START }}
        run: |
          set -euo pipefail

          if ! TZ="${TIMEZONE}" date >/dev/null 2>&1; then
            echo "::error::Invalid IANA timezone: ${TIMEZONE}"
            exit 1
          fi

          HOUR=$(TZ="${TIMEZONE}" date +%H)
          LOCAL_DATE=$(TZ="${TIMEZONE}" date '+%Y-%m-%d %H:%M:%S %Z')

          echo "Local time: ${LOCAL_DATE}"
          echo "Local hour: ${HOUR}"

          if (( 10#${HOUR} >= 10#${DAY_START} &&
                10#${HOUR} < 10#${NIGHT_START} )); then
            THEME="daylight"
            MODE="DAY"
          else
            THEME="aurora"
            MODE="NIGHT"
          fi

          echo "Theme: ${THEME}"
          echo "Mode: ${MODE}"

          echo "theme=${THEME}" >> "$GITHUB_OUTPUT"
          echo "mode=${MODE}" >> "$GITHUB_OUTPUT"
          echo "local_time=${LOCAL_DATE}" >> "$GITHUB_OUTPUT"

      - name: Generate Observatory
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          THEME: ${{ steps.theme.outputs.theme }}
        run: |
          set -euo pipefail

          mkdir -p profile

          node .observatory/src/cli.mjs \
            --user "${USERNAME}" \
            --theme "${THEME}" \
            --out profile/observatory.svg

          ls -lh profile/observatory.svg

      - name: Validate Observatory
        env:
          SVG: profile/observatory.svg
          EXPECTED_LOGIN: ${{ github.repository_owner }}
        run: |
          set -euo pipefail

          test -s "${SVG}"
          grep -q "<svg" "${SVG}"
          grep -q "</svg>" "${SVG}"
          grep -q "@${EXPECTED_LOGIN}" "${SVG}"

          grep -q "contributions" "${SVG}"
          grep -q "active days" "${SVG}"
          grep -q "current streak" "${SVG}"
          grep -q "longest streak" "${SVG}"

          if grep -q "Ada Example" "${SVG}"; then
            echo "::error::Sample profile detected."
            exit 1
          fi

          if grep -q "ada-example" "${SVG}"; then
            echo "::error::Sample GitHub login detected."
            exit 1
          fi

          SIZE=$(wc -c < "${SVG}")

          if (( SIZE < 5000 )); then
            echo "::error::Generated SVG is unexpectedly small."
            exit 1
          fi

          echo "SVG validation passed."

      - name: Commit and push Observatory safely
        env:
          MODE: ${{ steps.theme.outputs.mode }}
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          # Preserve the validated output while refreshing the branch.
          GENERATED_SVG="${RUNNER_TEMP}/observatory.svg"
          cp profile/observatory.svg "${GENERATED_SVG}"

          for attempt in 1 2 3; do
            echo "Push attempt ${attempt}/3"

            git fetch origin main

            # Start from the latest remote main so existing commits
            # are preserved and no rebase conflict is required.
            git reset --hard origin/main

            mkdir -p profile
            cp "${GENERATED_SVG}" profile/observatory.svg

            git add profile/observatory.svg

            if git diff --cached --quiet; then
              echo "Remote already contains the generated output."
              exit 0
            fi

            git commit \
              -m "chore: update profile observatory (${MODE})"

            if git push origin HEAD:main; then
              echo "Profile Observatory updated successfully."
              exit 0
            fi

            echo "Push failed. Will refresh main and retry."
            sleep 2
          done

          echo "::error::Could not push after three attempts."
          exit 1
